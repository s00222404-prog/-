services:
  - type: web
    name: vibe-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_RETURN_URL
        sync: false

  - type: web
    name: vibe-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /admin
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
